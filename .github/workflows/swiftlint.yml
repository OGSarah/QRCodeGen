name: SwiftLint

# Run SwiftLint (--strict) on every push to main and on pull requests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: swiftlint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        # Pin the version. `brew install swiftlint` tracks the newest release,
        # and rule behavior changes between versions (e.g. accessibility_label_for_image
        # tightened in 0.63), so an unpinned install fails CI on code that lints
        # clean locally. Bump this deliberately and re-lint when upgrading.
        env:
          SWIFTLINT_VERSION: 0.63.3
        run: |
          curl -sSL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
      - name: Verify SwiftLint version
        run: swiftlint version
      - name: Lint
        # Run from the directory that holds the root .swiftlint.yml WITHOUT
        # passing --config. An explicit --config disables nested-configuration
        # discovery, which would ignore the per-folder overrides in
        # QRCodeGenTests/.swiftlint.yml and QRCodeGenUITests/.swiftlint.yml.
        working-directory: QRCodeGen
        run: swiftlint lint --strict
